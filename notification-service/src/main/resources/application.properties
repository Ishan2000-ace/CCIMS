spring.application.name=notification-service
server.port=8083

# MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27018/CCIMS}

# JWT
jwt.secret=4f3b5c9d8e1a2f7b6c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b
jwt.expiration=86400000

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

# Kafka Consumer
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# JSON Deserialization
spring.kafka.consumer.properties.spring.json.trusted.packages=com.Forensics.CCIMS.Event
spring.kafka.consumer.properties.spring.json.value.default.type=com.Forensics.CCIMS.Event.CaseAssignedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
user-service.url=http://localhost:8080