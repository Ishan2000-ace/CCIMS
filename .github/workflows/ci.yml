
name: CCIMS CI

on:
  push:
    branches:
      - microservices
  pull_request:
    branches:
      - microservices

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn clean verify -DskipTests

      - name: Build User Service image
        run: docker build -t ccims-user-service:latest ./user-service

      - name: Build Case Service image
        run: docker build -t ccims-case-service:latest ./case-service

      - name: Build Evidence Service image
        run: docker build -t ccims-evidence-service:latest ./evidence-service

      - name: Build Notification Service image
        run: docker build -t ccims-notification-service:latest ./notification-service

      - name: Build Eureka Server image
        run: docker build -t ccims-eureka-server:latest ./eureka-server

      - name: Build Gateway Service image
        run: docker build -t ccims-gateway-service:latest ./gateway-service

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker images
        if: github.event_name == 'push'
        env:
          REGISTRY: ghcr.io/ishan2000-ace
          TAG: ${{ github.sha }}
        run: |
          for service in user-service case-service evidence-service notification-service eureka-server gateway-service; do
            docker tag "ccims-${service}:latest" "$REGISTRY/ccims-${service}:$TAG"
            docker tag "ccims-${service}:latest" "$REGISTRY/ccims-${service}:latest"
            docker push "$REGISTRY/ccims-${service}:$TAG"
            docker push "$REGISTRY/ccims-${service}:latest"
          done
