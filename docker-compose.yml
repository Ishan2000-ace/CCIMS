version: '3.8'

services:

  mongodb:
    image: mongo:8.0
    container_name: mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

  ccims:
    build: .
    container_name: ccims

    ports:
      - "8080:8080"

    depends_on:
      - mongodb

    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/CCIMS

volumes:
  mongodb_data: