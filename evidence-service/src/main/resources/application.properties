spring.application.name=EVIDENCE-SERVICE
server.port=8082

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27018/CCIMS}

jwt.secret=4f3b5c9d8e1a2f7b6c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b
jwt.expiration=86400000

spring.kafka.bootstrap-servers=localhost:9094

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
case-service.url=http://localhost:8081

file.upload-dir=./uploads/evidence
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

resilience4j.circuitbreaker.instances.caseService.sliding-window-size=5
resilience4j.circuitbreaker.instances.caseService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.caseService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.caseService.wait-duration-in-open-state=10s