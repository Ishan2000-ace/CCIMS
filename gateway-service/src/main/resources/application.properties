spring.application.name=GATEWAY-SERVICE
server.port=8085

management.endpoints.web.exposure.include=health,gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webflux.routes[0].id=case-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://CASE-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/cases/**

spring.cloud.gateway.server.webflux.routes[1].id=user-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/user/**

spring.cloud.gateway.server.webflux.routes[2].id=auth-route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[3].id=evidence-service-route
spring.cloud.gateway.server.webflux.routes[3].uri=lb://EVIDENCE-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/evidence/**

spring.cloud.gateway.server.webflux.routes[4].id=notification-service-route
spring.cloud.gateway.server.webflux.routes[4].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/notifications/**